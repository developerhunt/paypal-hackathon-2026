databases:
  - name: leash-db
    databaseName: leash
    user: leash_user
    plan: free

services:
  - type: web
    name: leash-agentic-trust-layer
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        value: https://leash-agentic-trust-layer.onrender.com
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CHANNEL3_API_KEY
        sync: false
      - key: FORCE_MOCK_PAYPAL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
